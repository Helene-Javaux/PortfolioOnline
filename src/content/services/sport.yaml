title: Sport
order: 2
cover: sport-23.jpg
description: >-
  Je photographie l'effort tel qu'il est : les mains crispées sur une prise, le souffle court après un run,
  la concentration avant ta dernière rep,... Pas de mise en scène, pas de sourires forcés, juste ce qui se passe
  quand on pousse son corps un peu plus loin.
  Je me suis fait la main sur l'escalade, la course à pied ou encore le crossfit. Si ta pratique est différente,
  dis moi ce que tu fais, je m'adapte volontiers à d'autres sports.
