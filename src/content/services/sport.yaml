description: >-
  Je photographie l'effort tel qu'il est : les mains crispées sur une prise, le souffle court après un run,
  la concentration avant votre dernière rep,... Pas de mise en scène, pas de sourires forcés, juste ce qui se passe
  quand on pousse son corps un peu plus loin.
  Je me suis fait la main sur l'escalade, la course à pied ou encore le crossfit. Si votre pratique est différente,
  dites-moi ce que vous faites, je m'adapte volontiers à d'autres sports.
