title: Wild Care
year: 2024
order: 1
cover: wildcare-04.jpg
description: >-
  Wild Care est un projet documentaire qui offre un regard intimiste sur le
  monde du soin de la faune sauvage, en milieu semi-urbain. Pendant plusieurs
  mois, j'ai exploré plusieurs centres dédiés au soin des animaux sauvages
  retrouvés blessés ou malades. En huis clos, je capture la vie unique qui
  émane de ces espaces, révélant des espaces et des gestes empreints de
  mystère, le tout dans une esthétique douce et énigmatique. La figure humaine
  est intentionnellement absente de mes images, révélant ainsi un écho à
  l'idée que le monde sauvage se porte mieux sans les êtres humains.
