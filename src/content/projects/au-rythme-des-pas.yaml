title: Au rythme des pas
year: 2022
order: 4
cover: ardp-05.jpg
description: >-
  Au rythme des pas est une immersion au cœur d'une fanfare de village. En
  suivant les musiciens dans leur quotidien, dans leurs répétitions et leurs
  déambulations, j'ai voulu documenter bien plus qu'un simple groupe musical :
  un véritable tissu vivant de traditions, de lieux et de souvenirs partagés.
  À travers une série de portraits réalisés dans les lieux emblématiques de
  leurs parades, mais aussi en capturant les objets et espaces qui composent
  leur univers, ce projet cherche à rendre hommage à la richesse discrète de
  ces pratiques locales. Chaque image porte en elle une part de leur histoire,
  de leur fierté, et de leur passion. C'est un travail de proximité et
  d'écoute, une manière de suivre leur rythme — celui des pas, des cuivres,
  des souvenirs — et de le partager à travers mon regard.
