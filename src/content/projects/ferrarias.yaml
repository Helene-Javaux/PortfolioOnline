title: Ferrarias
year: 2023
order: 2
cover: ferrarias-08.jpg
description: >-
  Mon projet vous transporte dans un voyage au cœur de l'histoire et du
  patrimoine de mon village d'enfance : Fraire. Ferrarias, signifiant fer en
  latin, était autrefois le nom de ce village qui abritait des mines de fer.
  Chaque image de la série raconte une partie de l'histoire collective du
  village, mettant en lumière les vestiges des mines ainsi que les objets et
  structures nés de leurs productions. Ces photographies invitent à découvrir
  les couches invisibles du temps qui se superposent à l'environnement
  familier. En contemplant ces photographies, vous êtes invités à vous
  immerger dans un passé riche en récits, à redécouvrir l'histoire qui nous
  entoure et à renforcer le lien entre le passé et le présent.
