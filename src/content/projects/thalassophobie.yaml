title: Thalassophobie
year: 2022
order: 3
cover: thalassophobie-05.jpg
description: >-
  Thalassophobie est un projet photographique né d'une peur profonde : celle
  de la mer et des grandes étendues d'eau. Ma phobie s'est transformée ici en
  matière à création. Plutôt que de fuir l'angoisse, j'ai choisi de la
  confronter, de la capturer, et surtout, de la partager. Réalisée en grande
  partie avec une GoPro — caméra emblématique des prises de vue immersives —
  cette série d'images reflète mon propre regard sur l'océan. Là où certains
  y verront des scènes paisibles, d'autres, sensibles à la thalassophobie, y
  percevront peut-être l'inquiétude sourde, le vertige, le sentiment d'inconnu
  qui m'accompagne face à ces étendues d'eau. Ce projet est avant tout un
  partage de sensation, une tentative de mettre en image une peur intime, et
  de résonner peut-être avec celles et ceux qui la connaissent aussi.
