title: Portrait animalier & duo avec votre compagnon
subtitle: Parce que la complicité avec son animal, ça se photographie aussi.
order: 1
packages:
  - title: Séance découverte (45 min à 1h)
    price: 140 €
    details:
      - Un animal ou un duo humain-animal
      - Séance en extérieur ou à domicile
      - 10 photos retouchées
  - title: Séance complète (1h30)
    price: 200 €
    details:
      - Jusqu'à 2 lieux ou mises en scène différentes
      - Animal seul et/ou en duo avec vous
      - 15 photos retouchées
  - title: Famille élargie (2h)
    price: 280 €
    details:
      - Plusieurs animaux et/ou plusieurs membres de la famille
      - Plusieurs lieux ou tenues possibles
      - 22 photos retouchées
notes:
  - Galerie en ligne privée
  - Livraison sous 2-3 semaines
  - Photo supplémentaire possible sur devis
  - Un temps d'échange avant la séance pour comprendre les habitudes et le confort de l'animal
  - Séance reportable en cas de stress ou d'imprévu du côté de l'animal